[project]
name = "smart-quant"
version = "0.1.0"
description = "Benchmarking extreme low-bit quantization on intelligence-dense open MoEs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.55",
    "datasets>=3.0",
    "huggingface-hub>=0.34",
    "lm-eval>=0.4.5",
    "accelerate>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "wandb>=0.18",
    "hydra-core>=1.3",
]

[project.optional-dependencies]
# vptq is deliberately absent: it ships no wheel past cp312 while this project requires >=3.13, so
# it cannot resolve here. It poisoned every `uv sync` rather than only `--extra quant`, because
# `uv lock` resolves all extras to build a universal lockfile. Restore it behind a
# `python_version < "3.13"` marker, or build it from source, if the deferred VPTQ baseline happens.
quant = ["aqlm>=1.1"]
viz = ["matplotlib>=3.9"]  # experiments/plot_quality_vs_bpw.py

# CI test surface. The unit suite exercises the pure-torch core
# (footprint/codebook/encode/expert_importance) only; transformers/datasets and the
# eval+cli study paths run on the GPU box, not in CI — so this stays torch + pytest.
[dependency-groups]
test = ["pytest>=8", "torch>=2.4"]

[project.scripts]
smart-quant = "smart_quant.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
