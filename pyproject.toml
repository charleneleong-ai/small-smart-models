[project]
name = "smart-quant"
version = "0.1.0"
description = "Benchmarking extreme low-bit quantization on intelligence-dense open MoEs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.55",
    "datasets>=3.0",
    "huggingface-hub>=0.34",
    "lm-eval>=0.4.5",
    "typer>=0.12",
    "rich>=13.7",
    "wandb>=0.18",
    "hydra-core>=1.3",
]

[project.optional-dependencies]
quant = ["vptq>=0.0.5", "aqlm>=1.1"]

[project.scripts]
smart-quant = "smart_quant.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
