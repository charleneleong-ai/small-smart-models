name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.13"
      - run: uv venv
      # Deps come from pyproject's `test` group (torch + pytest) — one source of truth.
      # --torch-backend cpu pulls the light CPU wheel; the GPU study paths run on the box.
      - run: uv pip install --group test --torch-backend cpu
      - run: uv run --no-project pytest -q
