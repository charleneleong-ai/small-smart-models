name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Tests import torch + transformers (CPU is fine); the CPU torch wheel keeps
      # CI light. Heavier model/GPU checks run on the A100 box, not here.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers pytest
      - run: pytest -q
